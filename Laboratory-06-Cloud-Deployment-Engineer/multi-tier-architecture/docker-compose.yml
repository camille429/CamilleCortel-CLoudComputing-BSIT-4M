version: '3'

services:
  db:
    image: mariadb:10.6
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: nextcloud_root
      MYSQL_PASSWORD: nextcloud_pass
      MYSQL_DATABASE: nextcloud_db
      MYSQL_USER: nextcloud_user
    volumes:
      - db:/var/lib/mysql

  nextcloud:
    image: nextcloud
    ports:
      - "8080:80"
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud_db
      MYSQL_USER: nextcloud_user
      MYSQL_PASSWORD: nextcloud_pass
    depends_on:
      - db

volumes:
  db:
